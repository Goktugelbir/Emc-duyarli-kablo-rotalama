name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # The published outputs, the coverage report and the browser tests come from the 3.11 run.
      PRIMARY: ${{ matrix.python-version == '3.11' }}
    steps:
      # Actions are pinned to full commit SHAs (the tag is in the comment); Dependabot keeps them current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.lock
      # The lock is universal (uv pip compile --universal): the same pins and hashes for every Python version.
      - name: Install (every package pinned by hash)
        run: pip install --require-hashes --no-deps -r requirements-ci.lock
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs; allowing them keeps the
      # sandbox on (the capture code never turns it off by itself, see harness_demo/capture.py).
      - name: Allow Chrome's sandbox (browser tests)
        if: env.PRIMARY == 'true'
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - name: Tests with coverage and the headless-Chrome viewer tests
        if: env.PRIMARY == 'true'
        env:
          HARNESS_BROWSER_TESTS: "1"
        run: pytest --cov=harness_demo --cov=main --cov-report=term-missing --cov-report=xml
      - name: Tests
        if: env.PRIMARY != 'true'
        run: pytest
      - name: Smoke run (no image export, no Chrome needed); fails if method e) fails a check
        run: python main.py --no-images --trials 3 --workers 2 --strict --out ci-out --docs ci-docs
      - name: Upload smoke-run outputs and the coverage report
        if: env.PRIMARY == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ci-outputs
          path: |
            ci-out
            ci-docs
            coverage.xml

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install (every package pinned by hash)
        run: pip install --require-hashes --no-deps -r requirements-ci.lock
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --strict --require-hashes --disable-pip -r requirements-ci.lock
      # The three.js bundle and the font are built from these npm packages (Node and npm are preinstalled
      # on the runner). Install scripts are not run; the registry signatures and known advisories are checked.
      - name: Audit the npm packages of the viewer bundle
        working-directory: harness_demo/viewer/vendor
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=moderate
          npm audit signatures
