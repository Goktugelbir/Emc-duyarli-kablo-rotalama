name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest
      - name: Smoke run (no image export, no Chrome needed)
        run: python main.py --no-images --trials 3 --workers 2 --out ci-out --docs ci-docs
      - name: Upload smoke-run outputs
        uses: actions/upload-artifact@v4
        with:
          name: ci-outputs
          path: |
            ci-out
            ci-docs
